# Every 30 minutes from 06:00 to 23:30 Vietnam time (UTC+7), ask the app to send
# study reminders to learners whose study time has just started.
name: Study reminders
on:
  schedule:
    - cron: "*/30 0-16,23 * * *"
  workflow_dispatch:
jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send due reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" https://nerva-ielts.vercel.app/api/cron/remind
